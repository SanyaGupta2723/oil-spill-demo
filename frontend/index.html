<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>🌤️ Real Weather App</h1>

    <button onclick="getWeather()">
        Check Weather
    </button>

    <div id="result"></div>

    <script>
        async function getWeather() {

            document.getElementById("result").innerHTML =
                "Loading...";

            try {

                const response = await fetch(
                    "/api/weather"
                );

                const data = await response.json();

                document.getElementById("result").innerHTML = `
                    <h2>${data.city}</h2>
                    <p>🌡️ Temperature: ${data.temperature} °C</p>
                    <p>💧 Humidity: ${data.humidity}%</p>
                    <p>💨 Wind Speed: ${data.windSpeed} km/h</p>
                `;

            } catch (error) {

                document.getElementById("result").innerHTML =
                    "❌ Backend not connected";

            }
        }
    </script>

</body>
</html>
